[project]
name = "clipboardgpt"
version = "0.1.2"
description = "A tool to process clipboard text using OpenAI's GPT models."
readme = "README.md"
authors = [{name = "Lars Bo Rasmussen", email = "lrasmussen@aio-it.dk"}]
requires-python = ">=3.11"
dependencies = [
    "openai>=2.12.0",
    "plyer>=2.1.0",
    "pyperclip>=1.11.0",
    "textual>=0.47.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
clipboardgpt = "clipboardgpt:main"
clipboardgpt-config = "clipboardgpt.config_tui:main"

[dependency-groups]
dev = [
    "ipython>=9.8.0",
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "ruff>=0.14.9",
]
